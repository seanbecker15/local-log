<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tiny-log-mcp</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <header>
      <strong>tiny-log-mcp</strong>
      <input
        id="filter"
        type="search"
        placeholder="filter logs (regex)"
        autocomplete="off"
        aria-label="Filter logs with a regular expression"
        aria-keyshortcuts="/"
      />
      <select id="level" aria-label="Minimum log level">
        <option value="trace">trace+</option>
        <option value="debug">debug+</option>
        <option value="info">info+</option>
        <option value="warn">warn+</option>
        <option value="error">error+</option>
      </select>
      <label class="follow"><input id="follow" type="checkbox" checked /> follow</label>
      <button id="clear" type="button" aria-label="Clear logs">clear</button>
      <span id="status" aria-live="polite"></span>
    </header>
    <ol id="log"></ol>
    <script src="/index.js"></script>
  </body>
</html>
